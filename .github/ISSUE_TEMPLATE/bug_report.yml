name: Bug report
description: Report reproducible incorrect behavior in aidget
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Read [docs/contributing.md](https://github.com/aidget-ai/aidget/blob/main/docs/contributing.md) before submitting.

        Keep this short and in your own words. Use Remove credentials, account identifiers, private widget contents and personal data from logs or screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest command sequence, widget files, or Agent prompt that reproduces the issue.
      placeholder: |
        aidget --home /tmp/aidget-repro ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aidget version
      description: Paste the output of `aidget --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64, Windows 11 amd64, Ubuntu 22.04 x64, Wayland/X11, ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets, account identifiers, private widget contents and personal data.
    validations:
      required: false
