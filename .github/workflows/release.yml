name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Validate release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node scripts/release/version.mjs parse "$TAG")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            test "$(jq -r .isDraft release.json)" = true
          fi

          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            node scripts/release/version.mjs newer "$TAG" "$LATEST"
          fi

  verify:
    needs: metadata
    uses: ./.github/workflows/check.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}

  build:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x64
            os: windows-2022
            target: ''
            bundles: nsis
          - name: linux-x64
            os: ubuntu-22.04
            target: ''
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"

      - uses: pnpm/setup@v3.1.1
        with:
          version: 12.15.0
          runtime: node@24
          cache: true
          install: false

      - uses: Swatinem/rust-cache@v2.9.3

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf rpm libfuse2

      - run: pnpm install --frozen-lockfile

      - name: Inject release version
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: node scripts/release/version.mjs set "$RELEASE_TAG"

      - name: Build with target
        if: matrix.target != ''
        run: pnpm tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: Build native target
        if: matrix.target == ''
        run: pnpm tauri build --ci --bundles "${{ matrix.bundles }}"

      # The updater replaces the `.app` in place, so the release also carries the
      # bundle as an archive that keeps its wrapper: `--keepParent` is what makes
      # it one.
      - name: Zip the macOS app for the updater
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP="target/${{ matrix.target }}/release/bundle/macos/aidget.app"
          mkdir -p appzip
          ditto -c -k --keepParent "$APP" "appzip/aidget_${VERSION}_${ARCH}.app.zip"

      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            appzip/*.app.zip

      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@v8.0.2
        with:
          path: downloaded
          merge-multiple: true

      - name: Collect and verify assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/assets.mjs \
            --version "v$VERSION" \
            --input downloaded \
            --output release

      - name: Generate bilingual release notes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: node scripts/release/notes.mjs --out release-notes.md

      - name: Stage release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            test "$(jq -r .isDraft release.json)" = true
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" release/* \
            --verify-tag \
            --draft \
            --title "aidget $TAG" \
            --notes-file release-notes.md

          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 9

      - name: Publish latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
