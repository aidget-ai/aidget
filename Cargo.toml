[package]
name = "aidget"
default-run = "aidget"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Agent-controllable desktop widgets"
license = "MIT"

[lib]
name = "aidget"
path = "src/lib.rs"

[[bin]]
name = "aidget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "7.0.0"
dunce = "1"
encoding_rs = "0.8.42"
include_dir = "0.7"
libc = "0.2"
lol_html = "3.0.2"
notify = "8.2.1"
percent-encoding = "2"
rmcp = { version = "3.7.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2.7.2"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
] }
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
sha2 = "0.11.1"
flate2 = "1.1.10"
tar = "0.4.46"
semver = "1.0.28"
fs2 = "0.4.3"
ts-rs = "12.0.1"
tempfile = "3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
cairo-rs = { version = "0.22.9", default-features = false, features = ["png"] }
webkit2gtk = "2.0"
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "proxy"] }

[target.'cfg(windows)'.dependencies]
junction = "2.1.0"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Devices_Geolocation",
  "Foundation",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
window-vibrancy = "0.8.1"
objc2-app-kit = { version = "0.3", features = [
  "NSCursor",
  "NSEvent",
  "NSImage",
  "NSGraphics",
  "NSBitmapImageRep",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-quartz-core",
] }
objc2-core-location = { version = "0.3", features = [
  "CLLocation",
  "CLLocationManager",
  "CLLocationManagerDelegate",
  "CLGeocoder",
  "CLPlacemark",
  "CLError",
  "block2",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSString", "NSValue"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.12.5", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
